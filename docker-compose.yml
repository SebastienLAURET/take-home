x-app-base: &app-base
  build:
    context: .
    dockerfile: .docker/app/Dockerfile
  environment:
    RAILS_ENV: ${RAILS_ENV:-development}
    DATABASE_HOST: db
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: password
    BUNDLE_PATH: /usr/local/bundle
    HMAC_SECRET_KEY: 1c860ae1936688e21df3c3cf8907fed2db158118f390a2a1d8714e9ff504f950
  volumes:
    - .:/app
    - bundle_data:/usr/local/bundle
  networks:
    - app_network

services:
  app:
    <<: *app-base
    ports:
      - "3000:3000"
    depends_on:
      - db
      - setup

  setup:
    <<: *app-base
    command: rails db:prepare
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: starter_rails_api_development
    networks:
      - app_network

volumes:
  postgres_data:
  bundle_data:


networks:
  app_network:
